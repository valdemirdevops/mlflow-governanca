# Treina, registra a versão como @challenger e roda o gate no servidor MLflow real.
# Dispara a cada merge na main que mude código, dados ou política (ou manualmente).
#
# Configuração (veja docs/configuracao-github.md):
#   variável do repositório  MLFLOW_TRACKING_URI
#   environment mlflow-treino com os segredos MLFLOW_TRACKING_USERNAME / _PASSWORD
# Sem MLFLOW_TRACKING_URI o job é pulado (forks e clones não quebram).
name: Treino e gate

on:
  push:
    branches: [main]
    paths: ["src/**", "dados/**", "governanca.yml", "requirements.txt"]
  workflow_dispatch:
    inputs:
      dados:
        description: Arquivo de dados para o treino
        default: dados/unicorn-2026-10.csv

permissions:
  contents: read

concurrency:
  group: treino-unicorn-ridge
  cancel-in-progress: false

jobs:
  treino-gate:
    if: vars.MLFLOW_TRACKING_URI != ''
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    environment: mlflow-treino
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Treinar e registrar versão
        id: treino
        env:
          DADOS: ${{ inputs.dados || 'dados/unicorn-2026-10.csv' }}
        run: python src/train.py --dados "$DADOS"

      - name: Marcar como challenger
        env:
          RUN_ID: ${{ steps.treino.outputs.run_id }}
        run: python src/promover.py challenger --run-id "$RUN_ID"

      - name: Gate (linhagem, atributos do IC e métrica)
        run: python src/promover.py gate

      - name: Evidência do challenger
        if: always() && steps.treino.outcome == 'success'
        run: python src/auditar.py --alias challenger --formato markdown --saida evidencia-challenger.md

      - uses: actions/upload-artifact@v4
        if: always() && steps.treino.outcome == 'success'
        with:
          name: evidencia-challenger-${{ github.run_id }}
          path: evidencia-challenger.md
