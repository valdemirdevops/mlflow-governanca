[mlflow]
# Quem não tem concessão explícita só lê
default_permission = READ
# Banco de usuários e permissões (separado do banco de metadados do MLflow)
database_uri = postgresql://mlflow:mlflow@postgres:5432/mlflow_auth
# Troque antes de expor o servidor. Em produção, injete via segredo, nunca no Git.
admin_username = admin
admin_password = troque-esta-senha-do-lab
